<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPSS Exam Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky tab bar; Learn = one concept per screen (visual first, 7 tap-open chips); sets = stacked question cards */
:root{
  --bg:#f7f1e8; --paper:#fffcf7; --ink:#3d332a; --muted:#7a6c5e; --line:#e7ddcf; --soft:#f4ece1;
  --accent:#8a6a50; --accent-soft:#f0e5d6; --hi:#f9e2b3; --hi-line:#d6a85e;
  --good:#5e7c4f; --good-soft:#e9efe1; --bad:#ad5a43; --bad-soft:#f6e4dc; --warn:#8a6524; --warn-soft:#fbf1df;
  --spss-head:#efe6d9;
  --sage:#5f7f62; --sage-soft:#e6eee2; --lilac:#7a6496; --lilac-soft:#eee8f5;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--paper);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:20px 14px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,4vw,2.2rem);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
.count{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:600 .95rem var(--f-body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--hi-line);outline-offset:2px}
main .wrap{padding-block:22px 60px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0}
.lead{color:var(--muted);max-width:66ch;margin:0 0 16px}

/* ---------- learn ---------- */
.cnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:thin}
.cnav button{flex:0 0 auto;font:600 .82rem var(--f-body);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer}
.cnav button.on{background:var(--sage);border-color:var(--sage);color:#fff}
.cnav .grp{flex:0 0 auto;font:600 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);align-self:center;padding:0 2px 0 8px}
.screen{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,3vw,30px)}
.eyebrow{font:600 .75rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--lilac)}
.hook{font-family:var(--f-display);font-weight:500;font-size:clamp(1.1rem,2.6vw,1.4rem);line-height:1.35;margin:10px 0 18px;padding:12px 16px;background:var(--sage-soft);border-left:4px solid var(--sage);border-radius:10px;max-width:60ch}
.menu{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 16px}
.menu span{font:500 .85rem var(--f-mono);background:var(--lilac-soft);border:1px solid #ddd2ea;border-radius:6px;padding:4px 9px}
.menu i{color:var(--muted);font-style:normal}
.spss{overflow-x:auto;margin:0 0 6px}
.spss .cap{font:700 .9rem var(--f-body);margin:0 0 4px}
.spss table{border-collapse:collapse;font:400 .88rem var(--f-body);font-variant-numeric:tabular-nums;background:var(--paper)}
.spss th,.spss td{border:1px solid var(--line);padding:5px 10px;text-align:right;white-space:nowrap}
.spss th{background:var(--spss-head);font-weight:600;text-align:center}
.spss td:first-child,.spss th:first-child{text-align:left}
.spss td.hi{background:var(--hi);outline:2px solid var(--hi-line);outline-offset:-2px;font-weight:700;position:relative}
.readhere{font:600 .78rem var(--f-mono);color:var(--warn);margin:4px 0 18px}
.readhere::before{content:"▲ "}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 .9rem var(--f-body);border:1.5px solid var(--accent);color:var(--accent);background:var(--paper);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-expanded="true"]{background:var(--accent);color:#fff}
.chip.alt{border-color:var(--line);color:var(--ink)}
.chip.alt[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip b{font-family:var(--f-mono);margin-right:4px}
.panel{margin-top:14px;padding:14px 16px;border-radius:10px;background:var(--soft);border:1px solid var(--line);max-width:72ch}
.panel p{margin:0 0 8px}.panel p:last-child{margin-bottom:0}
.panel ol,.panel ul{margin:0;padding-left:1.3em}.panel li{margin:3px 0}
.wording{display:grid;gap:8px}
.wording div{display:grid;grid-template-columns:1fr;gap:2px;padding:8px 10px;background:var(--paper);border-radius:8px;border:1px solid var(--line)}
.wording q{font-style:italic;quotes:"“" "”"}
.wording span{color:var(--accent);font-weight:600}
.calc{font-family:var(--f-mono);font-size:.88rem;background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-x:auto}
.friend{margin-top:10px;padding:8px 12px;border-left:3px solid var(--hi-line);background:var(--warn-soft);border-radius:0 8px 8px 0}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pn button{font:600 .9rem var(--f-body);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;color:var(--ink)}
/* triage */
.fork{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:14px 0 20px}
.branch{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper)}
.branch h3{margin-bottom:8px}
.flow{display:grid;gap:6px}
.flow a{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:8px;background:var(--soft);border:1px solid transparent}
.flow a:hover{border-color:var(--accent)}
.flow a small{display:block;color:var(--muted)}
.flow a b{font:600 .8rem var(--f-mono);color:var(--lilac);text-align:right}
.tri{width:100%;border-collapse:collapse;font-size:.92rem}
.tri th{text-align:left;font:600 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
.tri td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tri td:nth-child(2){font-weight:700;color:var(--sage)}
.tri td:nth-child(3){font-family:var(--f-mono);font-size:.8rem}
.scrollx{overflow-x:auto}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.map ol{margin:0;padding-left:2.1em}.map li{margin:4px 0}
.map li button{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}
.traps{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.traps li{display:grid;grid-template-columns:1fr;gap:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.traps .no{color:var(--bad);font-weight:600}.traps .yes{color:var(--good);font-weight:600}

/* ---------- sets ---------- */
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.seg button{font:600 .88rem var(--f-body);border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--lilac);color:#fff;border-color:var(--lilac)}
.seg button .done{font:600 .72rem var(--f-mono);margin-left:6px;color:var(--good)}
.seg button.on .done{color:#bff0d0}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px}
.file{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.file small{display:block;font:600 .72rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.file{background:var(--sage-soft)!important;border-color:#d3e0cd!important}
.file code{font:600 .9rem var(--f-mono);color:var(--sage);word-break:break-all}
.part{margin:26px 0 10px}
.part .story{color:var(--muted);max-width:72ch;margin:4px 0 0}
.q{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;display:grid;gap:10px}
.q.ok{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}
.qh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qn{font:700 .95rem var(--f-mono);color:var(--paper);background:var(--lilac);border-radius:6px;padding:1px 8px}
.dec{font:500 .78rem var(--f-mono);color:var(--muted)}
.orig{font-size:.86rem;color:var(--muted);margin:0;font-style:italic}
.orig::before{content:"Model wording: ";font-style:normal;font-weight:600}
.qt{margin:0;max-width:75ch}
.ans{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans input{font:500 1rem var(--f-mono);width:9.5rem;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.ans button{font:600 .9rem var(--f-body);padding:8px 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.fb{font-size:.92rem;font-weight:600}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}.fb.warn{color:var(--warn)}
.sol .big{font:700 1.3rem var(--f-mono);color:var(--good);margin-bottom:6px}
.sol h4{font:600 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.sol ol li{font-size:.92rem}
.sym{display:grid;gap:6px}
.sym div{display:grid;grid-template-columns:7.5rem 1fr;gap:8px;font-size:.92rem}
.sym div span:first-child{font:600 .72rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 6px}
.tools button{font:600 .82rem var(--f-body);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.note{font-size:.88rem;color:var(--muted);max-width:75ch}
@media (max-width:520px){.sym div{grid-template-columns:1fr}.ans input{width:100%}}
@media (prefers-reduced-motion:no-preference){.panel{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div><h1>SPSS Exam Drill</h1><p class="sub">STAT 2 · 21 questions, 3 blocks, always in the same order · <a href="https://sezsaracoglu-lab.github.io/dashshboard-/spss-exams/" style="color:var(--accent);font-weight:600">New: high-yield SPSS exams →</a></p></div>
  <div class="count" id="progress"></div>
</div></header>
<nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist">
  <button role="tab" data-tab="learn" aria-selected="true">1 · Learn SPSS 101</button>
  <button role="tab" data-tab="mirror" aria-selected="false">2 · Mock paper A</button>
  <button role="tab" data-tab="exam" aria-selected="false">3 · Exam sets 1–10</button>
  <button role="tab" data-tab="practice" aria-selected="false">4 · Practice sets 1–5</button>
</div></nav>
<main><div class="wrap">
  <section id="tab-learn"></section>
  <section id="tab-mirror" hidden></section>
  <section id="tab-exam" hidden></section>
  <section id="tab-practice" hidden></section>
</div></main>

<script>
const DATA = {"exam": [{"title": "Mock paper A", "parts": [{"label": "Part 1", "ds": "sleep(1)-1 (1).sav", "story": "Sleep-therapy exercise. Patients in therapy for sleep problems; depr = depression symptoms (1 none, 2 mild, 3 serious), sex (0 male, 1 female), improvement after therapy.", "qs": [{"type": "anova_F", "text": "Is there a difference in <b>improvement<\/b> between the 3 groups of depression level (depr)? Find the F value of this test. (3 decimals)", "ans": 3.776739858520726, "dec": 3, "show": "3.777", "path": ["Analyze → Compare Means → One-Way ANOVA → Dependent List: <b>improvement<\/b>, Factor: <b>depr<\/b> → OK"], "read": "ANOVA table → row <i>Between Groups<\/i> → column <b>F<\/b>.", "note": "df = 2 and 57; p = .029.", "signfree": false, "isp": false, "orig": "Find the F value and F test in a test"}, {"type": "anova_MSW", "text": "In this model, what is the mean residual variance? (3 decimals)", "ans": 5.014429695452475, "dec": 3, "show": "5.014", "path": ["Analyze → Compare Means → One-Way ANOVA → Dependent List: <b>improvement<\/b>, Factor: <b>depr<\/b> → OK"], "read": "ANOVA table → row <i>Within Groups<\/i> → column <b>Mean Square<\/b>.", "note": "\"Residual variance\" = error variance = Mean Square Within. (The <i>mean of saved residuals<\/i> is always 0, so that cannot be what they want.)", "signfree": false, "isp": false, "orig": "In a model find the mean residual variance"}, {"type": "bonf_SE", "text": "What is the standard error associated with the mean difference between the <b>none<\/b> group and the <b>serious<\/b> group? (3 decimals)", "ans": 0.7081263796422553, "dec": 3, "show": ".708", "path": ["Analyze → Compare Means → One-Way ANOVA → Dependent List: <b>improvement<\/b>, Factor: <b>depr<\/b> → Post Hoc → tick <b>Bonferroni<\/b> → Continue → OK"], "read": "Multiple Comparisons table → row (depr) none vs serious → column <b>Std. Error<\/b>.", "note": "Mean difference = 1.936. Any post-hoc test (LSD, Bonferroni) gives the same Std. Error: √(MSwithin·(1/n₁+1/n₂)).", "signfree": false, "isp": false, "orig": "What is the standard error in the group of identical twins associated with the mean difference of identical twins and the group of normal twins"}, {"type": "anova_SS", "text": "What is the smallest sum of squares in this model? (3 decimals)", "ans": 37.876392997130615, "dec": 3, "show": "37.876", "path": ["Analyze → Compare Means → One-Way ANOVA → Dependent List: <b>improvement<\/b>, Factor: <b>depr<\/b> → OK"], "read": "ANOVA table → column <b>Sum of Squares<\/b> → compare Between, Within, Total → take the smallest.", "note": "Between = 37.876, Within = 285.822, Total = 323.699. Total is always the biggest (Between + Within).", "signfree": false, "isp": false, "orig": "What is the sum of squares? What is the smallest sum of squares"}, {"type": "emm", "text": "Now study the effect of depression level (depr) and sex (sex) on improvement at the same time. What is the estimated marginal mean for <b>female<\/b>? (3 decimals)", "ans": 3.8001181894230807, "dec": 3, "show": "3.800", "path": ["Analyze → General Linear Model → Univariate → Dependent: <b>improvement<\/b>, Fixed Factor(s): <b>depr<\/b> and <b>sex<\/b>", "EM Means → move <b>sex<\/b> to 'Display Means for' → Continue → OK"], "read": "Estimated Marginal Means → table for <b>sex<\/b> → row female → column <b>Mean<\/b>.", "note": "EMM = average of the cell means (each cell counts equally), so it can differ from the plain mean in Descriptives when cells are unequal in size.", "signfree": false, "isp": false, "orig": "Form a two way anova, what is the estimated marginal mean for woman"}, {"type": "peta", "text": "In this model with both variables, what is the effect size of <b>depression level<\/b>? (3 decimals)", "ans": 0.17239404311556478, "dec": 3, "show": ".172", "path": ["Analyze → General Linear Model → Univariate → Dependent: <b>improvement<\/b>, Fixed Factor(s): <b>depr<\/b> and <b>sex<\/b>", "Options → tick <b>Estimates of effect size<\/  says:"Mean = the centre. SD = how far people typically are from it. Variance = the same spread but squared. SE = how much the mean would jump around if you took another sample.",

 friend:"Check by hand with the row %: 40.0% ÷ 70.0% = .571. If your RR matches this, you read the right row."},
{id:"exp",b:"cat",t:"Expected count",

 menu:["Crosstabs","Cells","☑ Observed  ☑ Expected"],

 says:"If gender and dish had nothing to do with each other, girls would make Asian dishes in the same proportion as everybody. The expected count is that number.",
 asks:[["What would be the expected number of Asian dishes prepared by a girl?","Expected Count in the girl × Asian cell."],["If there were no relation between study and throwing, what is the expected number of Administration students who threw low?","Same thing, Administration × Low cell."]],
 use:"<b>Crosstabs → Cells → Expected</b>. Keep Observed ticked so you can compare.",
 how:["Analyze → Descriptive Statistics → Crosstabs.","Rows and columns: the two variables in the question (order doesn't matter here).","Cells → tick <b>Expected</b> → OK.","Read the Expected Count line of the right cell."],
 ex:"girls in total = 24, Asian dishes in total = 15, N = 50\nexpected = 24 × 15 ÷ 50 = 7.2 dishes (children)",
 tells:"Observed 9 is more than expected 7.2: slightly more girls made an Asian dish than “no relation” predicts.",
 differs:"<b>Observed</b> = what happened; <b>expected</b> = what “no relation” predicts. The chi-square test measures the gap between the two. In goodness of fit you type the expected values yourself.",
 friend:"Expected counts may have decimals (7.2 children). That's fine: it's an average, not a real child."},
{id:"chi",b:"cat",t:"Chi-square test of independence",
 hook:"Two categorical variables → Crosstabs → Pearson Chi-Square (top row).",

 says:"Is there a relation between two category variables, or could the pattern in the crosstab be chance?",

 ex:"observed 12, 18 / 14, 6 · expected 15.6, 14.4 / 10.4, 9.6\nχ² = 3.6²/15.6 + 3.6²/14.4 + 3.6²/10.4 + 3.6²/9.6\n   = .831 + .900 + 1.246 + 1.350 = 4.327, df = 1, p = .037",

{id:"gof",b:"cat",t:"Chi-square goodness of fit (a claimed %)",
 hook:"One variable vs a claim → Nonparametric → Legacy Dialogs → Chi-square, and type the claim as expected values.",
 menu:["Analyze","Nonparametric Tests","Legacy Dialogs","Chi-square","Expected Values"],
 tab:{cap:"Test Statistics",h:["","age group"],r:[["Chi-Square","4.545a"],["df","1"],["Asymp. Sig.",".033"]],hi:[0,1]},read:"Chi-Square = test statistic; Asymp. Sig. = p.",
 says:"Someone claims “45% of the children are 8–10”. You check whether your sample's split fits that claim.",
 asks:[["45% of the participants are between 8–10 years old. What is the test statistic?","Does our split fit 45/55? → χ² value."],["Somebody claims 60% of students will throw high. Should we reject the claim? p-value?","Same test, read Asymp. Sig."]],
 use:"<b>Chi-square goodness of fit</b> (Session 2, exercise 2.2f–h). The claim becomes the expected values.",
 how:["Analyze → Nonparametric Tests → Legacy Dialogs → Chi-square.","Test Variable List: the variable (e.g. the age group you made).","Expected Values → Values: type 45 → Add, then 55 → Add. The order follows the codes: lowest code first!","OK → Test Statistics table."],
 ex:"N = 50, observed 30 (8–10) and 20 (11–13)\nexpected 45% × 50 = 22.5 and 55% × 50 = 27.5\nχ² = 7.5² ÷ 22.5 + 7.5² ÷ 27.5 = 2.500 + 2.045 = 4.545, df = 1, p = .033",

{id:"t1",b:"t",t:"One-sample t-test",
 hook:"One group's mean vs one fixed number from outside the data.",

 tab:{cap:"One-Sample Test (Test Value = 100)",h:["","t","df","Sig. (2-tailed)","Mean Difference"],r:[["IQ",".632","3",".572","2.000"]],hi:[0,3]},read:"Sig. (2-tailed) = p.",
 says:"Is the average of this group different from a number someone gives you (100, 5000, 8 minutes)?",
 asks:[["Is the average IQ different from 100?","Mean IQ vs the number 100."],["Are the Administration students' earnings different from 5000?","Select Administration, then test against 5000."]],
 use:"<b>One-Sample T Test</b>: one scale variable and one fixed value.",
 how:["Analyze → Compare Means → One-Sample T Test.","Test Variable: the scale variable. Test Value: the number from the question.","OK → read t or Sig. (2-tailed)."],
 ex:"IQs 96, 104, 110, 98 → mean 102, SD 6.325, SE = 6.325 ÷ √4 = 3.162\nt = (102 − 100) ÷ 3.162 = .632, df = 3, p = .572",
 tells:"p > .05 → no evidence that the mean differs from 100.",
 differs:"<b>One-sample</b>: number from outside. <b>Independent</b>: two groups. <b>Paired</b>: same people twice. A paired test equals a one-sample test of the difference scores against 0 (Session 1).",

{id:"tind",b:"t",t:"Independent-samples t-test (and Levene)",
 hook:"Levene first: Sig. ≥ .05 → TOP row; Sig. < .05 → BOTTOM row.",

 says:"Two separate groups of people (high vs low throwers, men vs women): do their means differ?",
 asks:[["Compare the students who threw high and low in terms of their earnings. Give the test statistic.","t of the independent t-test."],["Is there a difference between males and females on performance? Give the p-value.","Sig. (2-tailed) of the same test."],["Test whether the two age groups differ in mark.","Grouping variable = the age group you made."]],
 use:"<b>Independent-Samples T Test</b>: one scale variable, one grouping variable with two groups.",
 how:["Analyze → Compare Means → Independent-Samples T Test.","Test Variable: scale variable. Grouping Variable: the two-group variable.","Define Groups: type the codes exactly as in Variable View (0 and 1, or 1 and 2).","OK → look at Levene's Sig. → pick the row → read t or Sig. (2-tailed)."],
 ex:"group A: 4, 6, 8 (mean 6, variance 4) · group B: 7, 9, 11 (mean 9, variance 4)\npooled variance = 4 → SE = √(4 × (1/3 + 1/3)) = 1.633\nt = (6 − 9) ÷ 1.633 = −1.837, df = 4, p = .140",

{id:"tpair",b:"t",t:"Paired-samples t-test",
 hook:"Same people, two columns → Paired.",
 menu:["Analyze","Compare Means","Paired-Samples T Test"],

 says:"Every person was measured twice (this year and last year, own hours and estimate of others). Did the scores change?",

 use:"<b>Paired-Samples T Test</b>: two scale columns that belong to the same person.",
 how:["Analyze → Compare Means → Paired-Samples T Test.","Put the two variables in Pair 1 (Variable1, Variable2).","OK → Paired Samples Test → t or Sig. (2-tailed)."],
 ex:"(after, before): (7, 5), (9, 6), (5, 4) → differences 2, 3, 1\nmean 2, SD 1, SE = 1 ÷ √3 = .577\nt = 2 ÷ .577 = 3.464, df = 2, p = .074",

 differs:"Two <b>columns</b> per person → paired. One score column plus a <b>group</b> column → independent.",

{id:"anova1",b:"anova",t:"One-way ANOVA: F, sums of squares, mean squares",
 hook:"F = MS Between ÷ MS Within. “Residual”, “error” and “within” are three names for one row.",
 menu:["Analyze","Compare Means","One-Way ANOVA","Dependent + Factor"],
 tab:{cap:"ANOVA",h:["","Sum of Squares","df","Mean Square","F","Sig."],r:[["Between Groups","43.333","2","21.667","4.063",".045"],["Within Groups","64.000","12","5.333","",""],["Total","107.333","14","","",""]],hi:[0,4]},read:"F in the Between row. MS Within = the “mean residual variance”.",
 says:"Do three or more group means differ? ANOVA compares how far the groups are apart (between) with how much people vary inside each group (within).",
 asks:[["Find the F value and F test.","F in the Between Groups row."],["In a model, find the mean residual variance.","Mean Square in the Within Groups row."],["What is the smallest sum of squares?","Compare the Sum of Squares column."],["What is the MS (Mean Square) within groups?","Same as the residual variance."]],
 use:"<b>One-Way ANOVA</b>: one scale dependent variable, one factor with 3+ groups.",
 how:["Analyze → Compare Means → One-Way ANOVA.","Dependent List: the scale variable. Factor: the group variable.","(Options → Descriptive if you also want means.) OK.","ANOVA table: read F, Sum of Squares or Mean Square."],
 ex:"guilt data, Session 4: means 8, 4, 5 (n = 5 each), grand mean 5.667\nSSB = 5 × [(8−5.667)² + (4−5.667)² + (5−5.667)²] = 43.333\nSSW = 18 + 20 + 26 = 64.000\nMSB = 43.333 ÷ 2 = 21.667 · MSW = 64 ÷ 12 = 5.333\nF = 21.667 ÷ 5.333 = 4.063, p = .045",
 tells:"p < .05 → at least one group mean differs. Which one? That needs a post hoc test.",
 differs:"<b>SS</b> is a sum; <b>MS</b> = SS ÷ df, a variance. Total SS = Between + Within, so Total is never the smallest. The one-way F is not the same as a main-effect F in a two-way ANOVA.",
 friend:"A common note says “save residuals, then descriptives”. The mean of saved residuals is always 0. The residual variance they want is MS Within."},
{id:"posthoc",b:"anova",t:"Post hoc test (Bonferroni): SE and p of one pair",
 hook:"ANOVA says “something differs”. The post hoc table says “who differs from whom”.",
 menu:["One-Way ANOVA","Post Hoc","☑ Bonferroni"],
 tab:{cap:"Multiple Comparisons · Bonferroni",h:["(I) group","(J) group","Mean Diff. (I-J)","Std. Error","Sig."],r:[["record","no record","4.000","1.461",".054"],["","no info","3.000","1.461",".187"],["no record","record","-4.000","1.461",".054"]],hi:[0,3]},read:"Find the row with the two groups → Std. Error or Sig.",
 says:"For one specific pair of groups: how big is the difference, how precise is it (SE), and is it significant after correcting for doing several comparisons?",
 asks:[["What is the standard error associated with the mean difference of identical twins and normal twins?","Std. Error in that pair's row."],["Does the Bonferroni post hoc test show a difference between positive and negative gossip? Give the p-value.","Sig. in that pair's row."]],
 use:"<b>Post Hoc → Bonferroni</b> inside One-Way ANOVA.",
 how:["Analyze → Compare Means → One-Way ANOVA → Dependent + Factor.","Post Hoc → tick <b>Bonferroni</b> → Continue → OK.","Multiple Comparisons table → find (I) and (J) → Std. Error or Sig."],
 ex:"SE = √(MS Within × (1/n₁ + 1/n₂)) = √(5.333 × (1/5 + 1/5)) = 1.461\nt = 4.000 ÷ 1.461 = 2.739 → LSD p = .018\nBonferroni p = .018 × 3 pairs = .054",
 tells:".054 > .05 → after correction, groups 1 and 2 do not differ significantly.",
 differs:"Bonferroni p = LSD p × number of pairs (capped at 1.000). The Std. Error is the same for LSD and Bonferroni. Every pair appears twice (I–J and J–I) with the same SE and p. With only 2 groups this SE equals the t-test's Std. Error Difference (equal variances row).",
 friend:"Hook: Bonferroni “punishes” you for asking many questions by multiplying each p."},
{id:"anova2",b:"anova",t:"Two-way ANOVA: main effects, interaction, EM means",
 hook:"Two factors → General Linear Model → Univariate. Rows: factor A, factor B, A * B.",
 menu:["Analyze","General Linear Model","Univariate","EM Means / Options"],
 tab:{cap:"Tests of Between-Subjects Effects",h:["Source","Type III SS","df","Mean Square","F","Sig."],r:[["Corrected Model","…","3","…","…","…"],["Intercept","…","1","…","…","…"],["therapy","40.000","1","40.000","9.000",".005"],["gender","40.000","1","40.000","9.000",".005"],["therapy * gender","10.000","1","10.000","2.250",".142"],["Error","160.000","36","4.444","",""]],hi:[2,4]},read:"Main effect of a factor = F in that factor's own row. Interaction = the A * B row.",
 says:"You look at two grouping variables at once. Main effect = the overall difference for one factor (averaged over the other). Interaction = the effect of one factor depends on the level of the other.",
 asks:[["Form a two-way ANOVA. What is the estimated marginal mean for women?","EM Means table for gender → women."],["The main effect of twins?","F in the twins row."],["Is the difference between the groups the same for males and females (interaction)? Test statistic?","F in the group * gender row."]],
 use:"<b>Univariate</b> with both categorical variables as <b>Fixed Factor(s)</b>.",
 how:["Analyze → General Linear Model → Univariate.","Dependent Variable: the scale variable. Fixed Factor(s): both group variables.","EM Means → move the factor you need to “Display Means for”.","Options → tick Estimates of effect size (and Descriptive statistics). OK."],
 ex:"cell means: men-A 4, men-B 6, women-A 5, women-B 9\nEMM women = (5 + 9) ÷ 2 = 7.0 points · EMM men = (4 + 6) ÷ 2 = 5.0 points\neffect of B: men +2, women +4 → not parallel → possible interaction",
 tells:"A significant interaction means “it depends”: the therapy works differently for men and women.",
 differs:"<b>EMM</b> gives each cell equal weight; the plain mean in Descriptives weights by n, so they differ when cells are unequal. Never read Corrected Model or Intercept. Main-effect F (two-way) is not the one-way F.",
 friend:"Plots → factor A on Horizontal Axis, factor B as Separate Lines: crossing or diverging lines = interaction."},
{id:"peta",b:"anova",t:"Effect size: partial eta squared",
 hook:"Partial η² = SS effect ÷ (SS effect + SS error).",
 menu:["Univariate","Options","☑ Estimates of effect size"],
 tab:{cap:"Tests of Between-Subjects Effects (extra column)",h:["Source","Type III SS","F","Sig.","Partial Eta Squared"],r:[["therapy","40.000","9.000",".005",".200"],["gender","40.000","9.000",".005",".200"],["therapy * gender","10.000","2.250",".142",".059"],["Error","160.000","","",""]],hi:[0,4]},read:"Partial Eta Squared in the row of the effect they name.",
 says:"How big is the effect, apart from sample size? The share of variance an effect explains.",
 asks:[["What is the effect size?","Partial Eta Squared of the effect named (usually the main factor)."],["How strong is the effect of depression on improvement?","Same column, depression row."]],
 use:"<b>Univariate → Options → Estimates of effect size</b>.",
 how:["Run the two-way ANOVA (Univariate).","Options → tick <b>Estimates of effect size</b> → Continue → OK.","Tests of Between-Subjects Effects → last column → the right row."],
 ex:"SS therapy = 40, SS error = 160\npartial η² = 40 ÷ (40 + 160) = .200",
 tells:"Rough guide: .01 small, .06 medium, .14 large. .200 is a large effect.",

{id:"r",b:"reg",t:"Pearson correlation",
 hook:"r runs from −1 to +1. Sign = direction, size = strength.",
 menu:["Analyze","Correlate","Bivariate","☑ Pearson"],
 tab:{cap:"Correlations",h:["","","x","y"],r:[["x","Pearson Correlation","1",".982"],["","Sig. (2-tailed)","",".121"],["","N","3","3"]],hi:[0,3]},read:"The cell where the two variables cross (not the 1 on the diagonal).",
 says:"Do two scale variables go up and down together, and how tightly?",
 asks:[["What is the Pearson correlation between number of … and …?","r where the two variables cross."],["What is the relation between gossip2 and gossip3?","Both scale → correlation."]],
 use:"<b>Correlate → Bivariate</b> with Pearson: both variables are scale.",
 how:["Analyze → Correlate → Bivariate.","Move both variables in; Pearson is ticked by default.","OK → read the off-diagonal Pearson Correlation."],
 ex:"x: 1, 2, 3 · y: 2, 4, 5 (means 2 and 3.667)\nΣ(dx·dy) = 3.0 · Σdx² = 2 · Σdy² = 4.667\nr = 3 ÷ √(2 × 4.667) = .982",

{id:"reg1",b:"reg",t:"Simple regression: slope, F of the model, R²",
 hook:"Dependent = what you predict. Slope = change in y for 1 unit more x.",
 menu:["Analyze","Regression","Linear","Dependent + Independent(s)"],
 tab:{cap:"Coefficients",h:["Model","B","Std. Error","Beta","t","Sig."],r:[["(Constant)",".667","…","","…","…"],["x","1.500",".289",".982","5.196",".121"]],hi:[1,1]},read:"Slope = Unstandardized B of the predictor. (Model Summary → R Square; ANOVA table → F.)",

 use:"<b>Regression → Linear</b>. “Predict Y from/using X” → Y is Dependent, X is Independent.",
 how:["Analyze → Regression → Linear.","Dependent: the thing being predicted. Independent(s): the predictor(s).","OK → three tables: Model Summary (R²), ANOVA (F of the whole model), Coefficients (B, Beta, t)."],
 ex:"x: 1, 2, 3 · y: 2, 4, 5\nslope = Σ(dx·dy) ÷ Σdx² = 3 ÷ 2 = 1.500 y-units per x-unit\nintercept = 3.667 − 1.5 × 2 = .667 → ŷ = .667 + 1.5x\nR² = .982² = .964",

 friend:"“Predict A from B”: A goes in Dependent. Say it twice before you click."},
{id:"reg2",b:"reg",t:"Multiple regression: the best and the worst predictor",

const TRIAGE_ROWS = [

 ["“effect size”","Partial eta squared","Univariate → Options","peta"],
 ["“create a new variable”, age groups","Recode","Transform → Recode into Different","recode"],

const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

function table(t) {
  let h = `<div class="spss"><p class="cap">${t.cap}</p><table><thead><tr>${t.h.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>`;
  t.r.forEach((row, i) => { h += "<tr>" + row.map((v, j) => `<td${t.hi && t.hi[0] === i && t.hi[1] === j ? ' class="hi"' : ""}>${v}</td>`).join("") + "</tr>"; });
  return h + "</tbody></table></div>";
}
function menu(m) { return `<div class="menu" aria-label="SPSS menu path">${m.map(x => `<span>${x}</span>`).join("<i>›</i>")}</div>`; }

const SCREENS = [{id:"triage", t:"Triage: which test?"}, {id:"map", t:"The exam in order"}, ...C.map(c => ({id:c.id, t:c.t, b:c.b})), {id:"traps", t:"Traps to avoid"}];

function renderLearn() {

function go(id) {
  cur = id; store.set("spss-screen", id);
  document.querySelectorAll(".cnav button").forEach(b => b.classList.toggle("on", b.dataset.s === id));
  const on = document.querySelector(".cnav button.on"); if (on) on.scrollIntoView({block:"nearest", inline:"center"});
  drawScreen(); $("#screen").scrollIntoView({block:"start"});
}
function drawScreen() {
  const box = $("#screen"); const i = SCREENS.findIndex(s => s.id === cur); const s = SCREENS[i];
  let h = "";
  if (cur === "triage") h = triageHTML();
  else if (cur === "map") h = mapHTML();
  else if (cur === "traps") h = trapsHTML();
  else h = conceptHTML(cById[cur]);
  const prev = SCREENS[i - 1], next = SCREENS[i + 1];
  h += `<div class="pn">${prev ? `<button data-go="${prev.id}">← ${prev.t.replace(/:.*/, "")}</button>` : "<span></span>"}${next ? `<button data-go="${next.id}">${next.t.replace(/:.*/, "")} →</button>` : "<span></span>"}</div>`;
  box.innerHTML = h;
  box.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  box.querySelectorAll(".chip[data-k]").forEach(b => b.onclick = () => {
    const open = b.getAttribute("aria-expanded") === "true";

    const p = $("#cpanel"); if (open) { p.hidden = true; return; }
    b.setAttribute("aria-expanded", "true"); p.hidden = false; p.innerHTML = chipContent(cById[cur], b.dataset.k);
  });
}
const CHIPS = [["says","What this really says"],["asks","What the question asks"],["use","Use this"],["how","How to do it"],["ex","Worked example"],["tells","What it tells you"],["differs","Don't mix it up"]];

/* ---------------- QUESTION SETS ---------------- */
function parseNum(s) { s = String(s).trim().replace(/\s/g, "").replace(",", "."); if (/^[<]?\.?0*1?$/.test(s) && s.startsWith("<")) return 0; if (s.startsWith(".")) s = "0" + s; if (s.startsWith("-.")) s = "-0" + s.slice(1); const v = parseFloat(s); return isNaN(v) ? null : v; }
function check(q, raw) {
  const v = parseNum(raw); if (v === null) return ["warn", "Type a number, for example .043 or 4,213."];
  const tol = 1.01 * Math.pow(10, -q.dec);
  const near = x => Math.abs(x - q.ans) <= tol;
  if (q.isp && q.ans < 0.0005 && Math.abs(v) < 0.0011) return ["good", "Correct. SPSS shows .000 → report p < .001."];
  if (near(v)) return ["good", "Correct."];
  if (q.signfree && near(-v)) return ["good", "Correct size. The sign only depends on which group/direction comes first."];
  if (near(v / 100)) return ["warn", "That looks like a percentage. Divide by 100."];
  if (q.dec > 0 && Math.abs(v - q.ans) <= 3 * tol) return ["warn", `Very close. Check your rounding to ${q.dec} decimals.`];
  return ["bad", "Not yet. Open “Which test?” and check the row you read."];
}
function qCard(q, n, sid) {
  const id = `${sid}-${n}`;
  const a = el("article", {class:"q" + (solved[id] ? " ok" : ""), id});
  const tri = TRI[q.type];
  a.innerHTML = `<div class="qh"><span class="qn">Q${n}</span><span class="dec">${q.dec} decimal${q.dec > 1 ? "s" : ""}</span></div>
   ${q.orig ? `<p class="orig">${q.orig}</p>` : ""}<p class="qt">${q.text}</p>
   <div class="ans"><label class="dec" for="in-${id}">Your answer</label><input id="in-${id}" inputmode="decimal" autocomplete="off" value="${solved[id] || ""}"><button type="button">Check</button><span class="fb" aria-live="polite"></span></div>
   <p class="note locked">Hints and the answer unlock after your first Check.</p><div class="chips" hidden><button class="chip alt" data-p="t" aria-expanded="false">Which test?</button><button class="chip alt" data-p="s" aria-expanded="false">Answer + clicks</button><button class="chip alt" data-l="${tri[2]}">Learn it</button></div>
   <div class="panel" data-pp="t" hidden><div class="sym"><div><span>Symptom</span><span>${tri[0]}</span></div><div><span>Diagnosis</span><span><b>${tri[1]}</b></span></div><div><span>Treatment</span><span>${q.path[q.path.length - 1].split("→").slice(0, 3).join("→")} …</span></div></div></div>
   <div class="panel sol" data-pp="s" hidden><div class="big">${q.show}</div><h4>Clicks</h4><ol>${q.path.map(p => `<li>${p}</li>`).join("")}</ol><h4>Read here</h4><p>${q.read}</p>${q.note ? `<h4>Why / check</h4><p class="note">${q.note}</p>` : ""}</div>`;
  const inp = a.querySelector("input"), fb = a.querySelector(".fb");
  const unlock = () => { a.querySelector(".chips").hidden = false; const l = a.querySelector(".locked"); if (l) l.remove(); };
  if (solved[id]) unlock();
  const run = () => { const [cls, msg] = check(q, inp.value); fb.className = "fb " + cls; fb.textContent = msg; if (cls !== "warn" || parseNum(inp.value) !== null) unlock();
    if (cls === "good") { solved[id] = inp.value; a.classList.add("ok"); store.set("spss-solved", solved); updateProgress(); } };
  a.querySelector(".ans button").onclick = run; inp.onkeydown = e => { if (e.key === "Enter") run(); };
  a.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { const p = a.querySelector(`[data-pp="${b.dataset.p}"]`); const o = b.getAttribute("aria-expanded") === "true"; b.setAttribute("aria-expanded", String(!o)); p.hidden = o; });
  a.querySelector("[data-l]").onclick = () => { showTab("learn"); go(tri[2]); };
  return a;
}
function setHTML(target, set, sid, intro) {
  target.innerHTML = "";
  if (intro) target.append(intro);
  const files = el("div", {class:"files"});
  set.parts.forEach((p, i) => files.append(el("div", {class:"file"}, `<small>${p.label.split(" · ")[0]} · open</small><code>${p.ds}</code>`)));
  target.append(files);
  let n = 1;
  set.parts.forEach(p => {
    const sec = el("div", {class:"part"}, `<h3>${p.label}</h3><p class="story">${p.story} <b>File:</b> Data sets/${p.ds}</p>`);
    target.append(sec);
    p.qs.forEach(q => { target.append(qCard(q, n, sid)); n++; });
  });
  const tools = el("div", {class:"tools"}, `<button type="button">Clear my answers for this set</button>`);
  tools.querySelector("button").onclick = () => { Object.keys(solved).forEach(k => { if (k.startsWith(sid + "-")) delete solved[k]; }); store.set("spss-solved", solved); setHTML(target, set, sid, intro); updateProgress(); };
  target.append(tools);
}
function doneCount(sid, total) { return Object.keys(solved).filter(k => k.startsWith(sid + "-")).length; }

function updateProgress() {
  const total = DATA.exam.reduce((a, s) => a + s.parts.reduce((b, p) => b + p.qs.length, 0), 0) + DATA.practice.reduce((a, s) => a + s.parts.reduce((b, p) => b + p.qs.length, 0), 0);
